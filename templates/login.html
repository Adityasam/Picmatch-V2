{% extends 'base.html' %}
{% block title %}{{ heading }} · Picmatch{% endblock %}
{% block body %}
<form class="card stack auth" method="post" action="{{ action }}">
  <h1>{{ heading }}</h1>
  <input type="hidden" name="next" value="{{ next }}">
  <label class="field">Username <input name="username" required autocomplete="username" autofocus></label>
  <label class="field">Password <input name="password" type="password" required autocomplete="current-password"></label>
  {% if error %}<p class="note bad" role="alert">{{ error }}</p>{% endif %}
  <button class="btn block">Log in</button>
  {% if hint %}<p class="muted center" style="margin:0;font-size:.9rem">{{ hint }}</p>{% endif %}
</form>
{% endblock %}
