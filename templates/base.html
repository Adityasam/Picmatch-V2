<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Picmatch{% endblock %}</title>
<meta name="theme-color" content="#faf1e0">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/svg/picmatch-icon.svg') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/png/favicon-32.png') }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='icons/png/favicon-16.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/png/apple-touch-icon-180.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="preload" href="{{ url_for('static', filename='fonts/outfit-700-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
</head>
<body class="{% block bodyclass %}{% endblock %}">
<header class="topbar">
  <a class="brand" href="{% block home %}{{ url_for('manage') if admin_area else url_for('admin') }}{% endblock %}" aria-label="Picmatch home">
    <img src="{{ url_for('static', filename='icons/svg/picmatch-icon.svg') }}" alt="">
    <span class="wordmark">Pic<span>match</span></span>
    {% if admin_area %}<span class="pill">Admin</span>{% endif %}
  </a>
  <div class="topnav">
    {% block nav %}{% endblock %}
    {% block user %}
    {% set who, out = (g.admin, url_for('admin_logout')) if admin_area else (g.user, url_for('logout')) %}
    {% if who %}
    <span class="menu">
      <span class="muted who">{{ who.username }}</span>
      <form method="post" action="{{ out }}"><button class="link">Log out</button></form>
    </span>
    {% endif %}
    {% endblock %}
  </div>
</header>
<main class="wrap">
{% block body %}{% endblock %}
</main>
</body>
</html>
